# LightGBM baseline on EMBER2024 Win64 static features
# Colab run: 120k train / 40k test / full Win64 challenge subset (814 samples)

experiment:
  name: lightgbm_win64_baseline
  seed: 42
  description: >
    LightGBM baseline on EMBER2024 Win64 static features.
    Standard test vs evasive challenge drop-off comparison.

data:
  raw_dir: data/raw
  processed_dir: data/processed/static_win64
  file_type: Win64
  train_max_samples: 120000
  test_max_samples: 40000
  train_max_files: 16
  test_max_files: 8

model:
  name: lightgbm
  val_fraction: 0.1
  params:
    objective: binary
    boosting: gbdt
    num_iterations: 500
    learning_rate: 0.1
    num_leaves: 64
    min_data_in_leaf: 100
    bagging_fraction: 0.9
    bagging_freq: 1
    feature_fraction: 0.9
    lambda_l2: 1.0
    is_unbalance: true
    metric: [auc, binary_logloss]
    verbosity: -1
    seed: 42

evaluation:
  threshold: 0.5
  mix_test_benign_into_challenge: true

output:
  results_dir: experiments/results/lightgbm_win64_baseline
  report_table: report/tables/lightgbm_win64_baseline_results
  model_path: experiments/results/lightgbm_win64_baseline/model.txt
