# Tier 1 ablation: transformer with BYTE PATCH tokens only (no static token).
# Compare to BiLSTM (~35.6% challenge) and full multimodal (~58.4%).

experiment:
  name: transformer_bytes_only_win64
  seed: 42
  description: >
    Tier 1 modality ablation — histogram-derived byte patches only via transformer.
    Static PE feature branch disabled.

data:
  raw_dir: data/raw
  static_dir: data/processed/static_win64
  bytes_dir: data/processed/bytes_win64
  file_type: Win64
  seq_len: 4096
  train_max_samples: 120000
  test_max_samples: 40000
  train_max_files: 16
  test_max_files: 8

model:
  type: multimodal_transformer
  modality: bytes_only
  patch_size: 16
  byte_embed_dim: 32
  d_model: 128
  nhead: 4
  num_layers: 3
  ff_dim: 256
  dropout: 0.2
  train:
    val_fraction: 0.1
    batch_size: 32
    epochs: 15
    learning_rate: 0.0003
    weight_decay: 0.0001
    patience: 3
    use_gpu: true
    predict_batch_size: 64

evaluation:
  threshold: 0.5
  mix_test_benign_into_challenge: true

output:
  results_dir: experiments/results/ablations/transformer_bytes_only_win64
  report_table: report/tables/ablations/transformer_bytes_only_win64_results
  model_path: experiments/results/ablations/transformer_bytes_only_win64/model.pt
  model_label: "Transformer (bytes only)"
  report_title: "Tier 1 Ablation — Bytes-Only Transformer (EMBER2024 Win64)"
  input_description: >
    Histogram-derived byte sequence as 256 patch tokens + CLS through self-attention.
    Static EMBER feature branch disabled.
